
name: Auto Extract ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract ZIP files
        shell: bash
        run: |
          shopt -s nullglob

          for file in *.zip; do
            echo "Extracting: $file"

            temp=$(mktemp -d)
            unzip -oq "$file" -d "$temp"

            entries=("$temp"/* "$temp"/.[!.]*)

            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}"/. .
            else
              cp -a "$temp"/. .
            fi

            rm -rf "$temp"
            rm -f "$file"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Automatically extract ZIP files"
          git push
