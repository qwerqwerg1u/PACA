
name: Auto Extract ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract all ZIP files
        shell: bash
        run: |
          set -e

          mapfile -d '' archives < <(
            find . -path './.git' -prune -o -type f -iname '*.zip' -print0
          )

          for file in "${archives[@]}"; do
            echo "Extracting: $file"

            temp=$(mktemp -d)
            unzip -oq "$file" -d "$temp"

            mapfile -d '' entries < <(
              find "$temp" -mindepth 1 -maxdepth 1 -print0
            )

            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}"/. .
            else
              cp -a "$temp"/. .
            fi

            rm -rf "$temp"
            rm -f "$file"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Automatically extract ZIP files"
            git push
          fi
