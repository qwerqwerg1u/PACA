
name: Auto Extract ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Extract ZIP files
        shell: bash
        run: |
          python3 <<'PY'
          import zipfile
          import pathlib
          import shutil
          import tempfile

          root = pathlib.Path(".").resolve()
          archives = [
              p for p in root.rglob("*.zip")
              if ".git" not in p.parts
          ]

          if not archives:
              raise SystemExit("No ZIP files found")

          for archive in archives:
              print(f"Extracting: {archive}")

              with tempfile.TemporaryDirectory() as temp:
                  temp = pathlib.Path(temp)

                  with zipfile.ZipFile(archive) as z:
                      for item in z.infolist():
                          target = (temp / item.filename).resolve()
                          if not target.is_relative_to(temp.resolve()):
                              raise ValueError("Unsafe ZIP path")
                      z.extractall(temp)

                  entries = list(temp.iterdir())

                  if len(entries) == 1 and entries[0].is_dir():
                      source = entries[0]
                  else:
                      source = temp

                  for item in source.iterdir():
                      destination = root / item.name

                      if item.is_dir():
                          shutil.copytree(
                              item, destination,
                              dirs_exist_ok=True
                          )
                      else:
                          shutil.copy2(item, destination)

              archive.unlink()
              print(f"Done: {archive.name}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto extract ZIP"
          git push
