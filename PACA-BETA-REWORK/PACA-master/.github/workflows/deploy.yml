name: Deploy Web UI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Clyde Luau engine (MIT)
        uses: actions/checkout@v4
        with:
          repository: sfr-development/Lua-Obfuscator-Clyde-Protection
          ref: main
          path: third_party/clyde
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test upstream Luau parser and VM
        run: |
          npm ci --prefix third_party/clyde
          npm run build --prefix third_party/clyde
          npm test --prefix third_party/clyde -- --runInBand --passWithNoTests
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle PACA Luau engine
        run: node scripts/build-clyde-bundle.mjs
      - name: Verify parser and VM feature set
        run: node scripts/smoke-test-clyde.mjs
      - name: Build PACA BETA
        run: pnpm --filter web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
