
name: Deploy Web UI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Obscura Luau engine (MIT)
        uses: actions/checkout@v4
        with:
          repository: vo3pal/obscura
          ref: main
          path: third_party/obscura
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and smoke-test Obscura VM engine
        run: |
          python -m compileall -q third_party/obscura
          python -m pip install -r third_party/obscura/requirements.txt
          python third_party/obscura/main.py tests/fixtures/obscura-luau-smoke.luau --mode vm -o /tmp/paca-obscura-smoke.luau
          test -s /tmp/paca-obscura-smoke.luau
      - run: pnpm install --frozen-lockfile
      - name: Build PACA with the Obscura Luau engine
        run: pnpm run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
